services:
  mysql:
    image: mysql:8.0
    container_name: street-football-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: street_football_rush
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - street-football-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: street-football-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      ENV: development
      LOG_LEVEL: info
      DB_TYPE: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppassword
      DB_NAME: street_football_rush
      CORS_ORIGINS: "*"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - street-football-network

volumes:
  mysql_data:

networks:
  street-football-network:
    driver: bridge

